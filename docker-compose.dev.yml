services:
    db:
        image: postgres:17-alpine
        container_name: soniclight-db-dev
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data
            - ./server/init-db:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - soniclight-network

    backend:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: soniclight-backend-dev
        restart: unless-stopped
        command: sh -c "npm ci && npx prisma migrate deploy && npm run dev"
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            - NODE_ENV=${ENVIRONMENT}
            - PORT=8000
        ports:
            - "8000:8000"
        volumes:
            - ./server:/app
            - backend_node_modules:/app/node_modules
        depends_on:
            db:
                condition: service_healthy
        networks:
            - soniclight-network

    frontend:
        build:
            context: ./client
            dockerfile: Dockerfile
        container_name: soniclight-frontend-dev
        restart: unless-stopped
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
        environment:
            - VITE_API_URL=http://localhost:8000
            - NODE_ENV=development
        ports:
            - "5173:5173"
        volumes:
            - ./client:/app
            - frontend_node_modules:/app/node_modules
        depends_on:
            - backend
        networks:
            - soniclight-network

volumes:
    postgres_dev_data:
        name: soniclight_postgres_dev_data
        external: true
    frontend_node_modules:
        name: soniclight_frontend_node_modules
        external: true
    backend_node_modules:
        name: soniclight_backend_node_modules
        external: true

networks:
    soniclight-network:
        driver: bridge
